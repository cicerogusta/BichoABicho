name: bicho_a_bicho
description: Bicho a Bicho — aprender e brincar no seu ritmo.
publish_to: 'none'
version: 2.0.0+2
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.8.1
  speech_to_text: ^7.5.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  shared_preferences: ^2.5.6
  cupertino_icons: ^2.0.0
  firebase_analytics: ^13.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/welcome.png
    - assets/animal_dog.png
    - assets/animal_cat.png
    - assets/animal_lion.png
    - assets/animal_elephant.png
    - assets/animal_cow.png
    - assets/animal_horse.png
    - assets/animal_sheep.png
    - assets/animal_duck.png
    - assets/cow.wav
    - assets/horse.wav
    - assets/sheep.wav
    - assets/duck.wav
    - assets/audio_credits.txt
    - assets/filhote_latindo.wav
    - assets/gato.mp3
    - assets/leao.mp3
    - assets/elefante.mp3
    - assets/celebration.wav
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito.ttf
